name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the OIDC handshake that gets temporary AWS credentials. No
# long-lived access keys are stored in this repository.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    # Deliberately no `environment:` here. Declaring one changes the OIDC
    # subject claim from repo:<repo>:ref:refs/heads/main to
    # repo:<repo>:environment:<name>, which no longer matches a trust policy
    # pinned to the branch. If you want an environment — for a required
    # approval before each deploy — add it back AND set the stack's
    # GitHubRefPattern to environment:<name>, or the deploy stops
    # authenticating.
    steps:
      # Checked before anything else: AWS answers a malformed ARN with
      # "Request ARN is invalid" after a minute of retries, which says nothing
      # about what is actually wrong. Two seconds here saves a whole build.
      - name: Check the deploy role is configured
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          hint='Take it from the DeployRoleArn output of the CI stack, and set it under Settings -> Secrets and variables -> Actions -> Variables.'
          if [[ -z "$ROLE_ARN" ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not set. $hint"
            exit 1
          fi
          if [[ "$ROLE_ARN" == *":oidc-provider/"* ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is the OIDC provider ARN, not the deploy role ARN — an identity provider cannot be assumed. You want arn:aws:iam::<account>:role/<something>-github-deploy. $hint"
            exit 1
          fi
          if [[ ! "$ROLE_ARN" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not an IAM role ARN. Expected arn:aws:iam::<account>:role/<name>, got '$ROLE_ARN'. $hint"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # A broken build must never reach the bucket.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # AWS answers a trust-policy mismatch with a bare "Not authorized to
      # perform sts:AssumeRoleWithWebIdentity" and will not say what it
      # compared, so print the identity being presented. Without this, the one
      # value that decides the outcome is the only one nobody can see.
      - name: Show the identity GitHub will present
        run: |
          set -euo pipefail
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')
          # The token is a credential in its own right: mask it immediately so
          # it cannot reach the log, and print only the two claims that matter.
          echo "::add-mask::$token"
          part=$(printf '%s' "$token" | cut -d. -f2)
          pad=$(( (4 - ${#part} % 4) % 4 ))
          part="${part}$(printf '=%.0s' $(seq 1 $pad 2>/dev/null))"
          claims=$(printf '%s' "$part" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          echo "subject  (sub): $(printf '%s' "$claims" | jq -r .sub)"
          echo "audience (aud): $(printf '%s' "$claims" | jq -r .aud)"
          echo
          echo "The role's trust policy must allow that exact subject, and the"
          echo "identity provider must list that audience. Compare against"
          echo "IAM -> Roles -> <the deploy role> -> Trust relationships."

      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Read stack outputs
        id: stack
        env:
          STACK_NAME: ${{ vars.SITE_STACK_NAME || 'student-loan-calculator-site' }}
        run: |
          set -euo pipefail
          read_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          {
            echo "bucket=$(read_output BucketName)"
            echo "distribution=$(read_output DistributionId)"
            echo "url=$(read_output SiteUrl)"
          } >> "$GITHUB_OUTPUT"

      # Hashed assets are immutable and cached for a year; index.html is
      # revalidated on every visit so a deploy takes effect immediately.
      # Assets upload first, so the HTML never references a file that is not
      # there yet.
      - name: Upload assets
        run: |
          aws s3 sync dist/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --delete \
            --exclude 'index.html' \
            --exclude '*.map' \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://${{ steps.stack.outputs.bucket }}/index.html" \
            --cache-control 'public,max-age=0,must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      - name: Invalidate the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths '/*'

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "The calculator is live at ${{ steps.stack.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
