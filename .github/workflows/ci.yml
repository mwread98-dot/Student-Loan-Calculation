name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built site
        run: |
          npx vite preview --port 4173 --strictPort &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          npm run smoke
        env:
          SMOKE_URL: http://127.0.0.1:4173/

  validate-infrastructure:
    name: Validate CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cfn-lint

      - name: Lint templates
        run: cfn-lint infra/*.yml
