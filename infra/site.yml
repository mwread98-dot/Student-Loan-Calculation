AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Static hosting for the student loan overpayment calculator: a private S3
  bucket served through CloudFront over HTTPS. The bucket is never public —
  CloudFront reaches it through an Origin Access Control, and the bucket policy
  trusts only this distribution.

Parameters:
  ProjectName:
    Type: String
    Default: student-loan-calculator
    Description: Prefix for resource names.
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,40}$'
    ConstraintDescription: Lowercase letters, numbers and hyphens only.

  DomainName:
    Type: String
    Default: ''
    Description: >-
      Optional custom domain, e.g. loans.example.com. Leave blank to use the
      CloudFront domain. Requires AcmCertificateArn.

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >-
      ARN of an ACM certificate covering DomainName. CloudFront only accepts
      certificates issued in us-east-1, whichever region this stack runs in.

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >-
      Which CloudFront edge locations to use. PriceClass_100 (North America and
      Europe) is the cheapest and covers a UK audience.

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref AcmCertificateArn, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    # Keep the bucket if the stack is deleted, so a mistaken teardown does not
    # silently destroy content.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          # Old builds are only useful for a quick rollback.
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        Description: Lets this distribution, and nothing else, read the bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-security-headers'
        Comment: Security headers for a self-contained static site.
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            # The calculator has nothing to gain from leaking referrers.
            ReferrerPolicy: no-referrer
            Override: true
          ContentSecurityPolicy:
            # The site loads no third-party script, font, frame or endpoint.
            # 'unsafe-inline' is needed for styles only, because the charting
            # library sets inline style attributes on the elements it draws.
            ContentSecurityPolicy: >-
              default-src 'none';
              script-src 'self';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data:;
              font-src 'self';
              connect-src 'self';
              manifest-src 'self';
              base-uri 'none';
              form-action 'none';
              frame-ancestors 'none'
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} static site'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            # Empty OriginAccessIdentity is what Origin Access Control expects;
            # the legacy OAI mechanism is not in use here.
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized: respects the Cache-Control set at upload,
          # so hashed assets cache for a year and index.html revalidates.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CustomErrorResponses:
          # With a private bucket, a missing key comes back as 403 rather than
          # 404, so both are served the app shell.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

Outputs:
  BucketName:
    Description: Bucket the built site is uploaded to.
    Value: !Ref SiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  DistributionId:
    Description: Distribution to invalidate after each deploy.
    Value: !Ref Distribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  DistributionDomainName:
    Description: CloudFront domain for the site.
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-DistributionDomainName'

  SiteUrl:
    Description: Where the calculator is served.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'

  DnsTarget:
    Condition: HasCustomDomain
    Description: Point an ALIAS or CNAME record for your domain at this.
    Value: !GetAtt Distribution.DomainName
